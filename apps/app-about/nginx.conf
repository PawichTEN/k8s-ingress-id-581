# app-about : nginx config (mounted at /etc/nginx/conf.d/default.conf)
# Ingress sends www.id-581.com/  and  www.id-581.com/about*  here (no rewrite).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    charset utf-8;

    ssi on;                         # lets the pages print $hostname (Pod name)
    add_header X-Served-By $hostname always;

    location = /healthz { access_log off; return 200 "ok\n"; }

    # www.id-581.com/  -> landing page
    location = / { try_files /home.html =404; }

    # www.id-581.com/about  and  /about/  -> about page
    location = /about  { try_files /index.html =404; }
    location = /about/ { try_files /index.html =404; }

    # www.id-581.com/about/photo.jpg -> photo
    location /about/ { rewrite ^/about/(.*)$ /$1 break; }

    location / { return 404; }
}

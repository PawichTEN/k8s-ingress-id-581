# Deploy everything with:   kubectl apply -k .
# kustomize builds the ConfigMaps from the files in apps/ so the code and pages
# live as normal files in the repo (not pasted inside YAML).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- manifests/00-namespace.yaml
- manifests/10-app-about.yaml
- manifests/20-app-research.yaml
- manifests/30-app-api.yaml
- manifests/40-ingress.yaml

generatorOptions:
  disableNameSuffixHash: true   # keep plain ConfigMap names (deploy.sh restarts Pods after changes)

configMapGenerator:
- name: app-about-html
  namespace: id-581
  files:
  - apps/app-about/index.html
  - apps/app-about/home.html
- name: app-about-photo          # binary file -> stored as binaryData
  namespace: id-581
  files:
  - apps/app-about/photo.jpg
- name: app-about-nginx
  namespace: id-581
  files:
  - apps/app-about/nginx.conf
- name: app-research-code
  namespace: id-581
  files:
  - apps/app-research/server.py
- name: app-research-seed
  namespace: id-581
  files:
  - apps/app-research/research.md
- name: app-api-code
  namespace: id-581
  files:
  - apps/app-api/server.py

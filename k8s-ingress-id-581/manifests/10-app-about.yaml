# app-about : www.id-581.com/  and  www.id-581.com/about
# nginx:alpine serves index.html / home.html / photo.jpg from ConfigMaps
# (ConfigMaps are generated by kustomization.yaml from apps/app-about/*)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-about
  namespace: id-581
  labels:
    app: app-about
spec:
  replicas: 2
  selector:
    matchLabels:
      app: app-about
  template:
    metadata:
      labels:
        app: app-about
    spec:
      containers:
      - name: nginx
        image: nginx:alpine
        ports:
        - name: http
          containerPort: 80
        volumeMounts:
        - name: html
          mountPath: /usr/share/nginx/html
          readOnly: true
        - name: nginx-conf
          mountPath: /etc/nginx/conf.d/default.conf
          subPath: nginx.conf
          readOnly: true
        readinessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 2
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 10
          periodSeconds: 15
        resources:
          requests:
            cpu: 20m
            memory: 32Mi
          limits:
            cpu: 200m
            memory: 64Mi
      volumes:
      - name: html                  # pages + photo combined in one folder
        projected:
          sources:
          - configMap:
              name: app-about-html
          - configMap:
              name: app-about-photo
      - name: nginx-conf
        configMap:
          name: app-about-nginx
---
apiVersion: v1
kind: Service
metadata:
  name: app-about
  namespace: id-581
  labels:
    app: app-about
spec:
  type: ClusterIP
  selector:
    app: app-about
  ports:
  - name: http
    port: 80
    targetPort: http

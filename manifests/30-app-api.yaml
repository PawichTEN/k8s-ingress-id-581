# app-api : www.id-581.com/api/<ข้อความ>  -> shows <ข้อความ> big in the middle of the screen
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-api
  namespace: id-581
  labels:
    app: app-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: app-api
  template:
    metadata:
      labels:
        app: app-api
    spec:
      containers:
      - name: app
        image: python:3.12-alpine
        command: ["python", "-u", "/app/server.py"]
        env:
        - name: PORT
          value: "8080"
        ports:
        - name: http
          containerPort: 8080
        volumeMounts:
        - name: code
          mountPath: /app
          readOnly: true
        readinessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 2
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 10
          periodSeconds: 15
        resources:
          requests:
            cpu: 20m
            memory: 32Mi
          limits:
            cpu: 300m
            memory: 128Mi
      volumes:
      - name: code
        configMap:
          name: app-api-code
---
apiVersion: v1
kind: Service
metadata:
  name: app-api
  namespace: id-581
  labels:
    app: app-api
spec:
  type: ClusterIP
  selector:
    app: app-api
  ports:
  - name: http
    port: 80
    targetPort: http
